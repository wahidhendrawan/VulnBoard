services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vulnboard-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: file:/app/data/vulnboard.db
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -hex 32)}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:5173}
      PORT: 4000
    volumes:
      - db_data:/app/data
      - reports_data:/app/data/reports
    # Loopback only: browsers reach the API through nginx (/api), the one proxy hop the backend trusts.
    ports:
      - "127.0.0.1:4000:4000"
    networks:
      - vulnboard

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/api}
    container_name: vulnboard-frontend
    restart: unless-stopped
    ports:
      - "5173:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - vulnboard

volumes:
  db_data:
  reports_data:

networks:
  vulnboard:
    driver: bridge
